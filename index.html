$('#app').innerHTML=`<h2 style="margin-top:.4em">جدول التبادل ومتابعة الطلبات</h2><div class="tabs">${['pending','ongoing','done'].map(t=>`<button class="tab ${S.tab===t?'on':''}" onclick="S.tab='${t}';R.orders()">${CN[t]} (${S.orders.filter(o=>t==='pending'?o.st==='pending':t==='ongoing'?['ongoing','disputed'].includes(o.st):o.st==='done').length})</button>`).join('')}</div>
${L.length?L.map(ocard).join(''):'<div class="empty">مفيش طلبات هنا. ابدأ بتصفح المكتبة وابعت طلب.</div>'}`},
wallet(){$('#app').innerHTML=`<h2 style="margin-top:.4em">محفظة بوك نوك</h2><div class="card"><div style="color:var(--mut)">رصيد النقاط</div><div class="big">${S.pts} <span style="font-size:1.1rem">نقطة قراءة</span></div><p style="color:var(--mut);margin:0">النقاط مش فلوس. بتاخدها لما تعرض كتاب، وتصرفها لما تطلب كتاب.</p><div class="row" style="margin-top:10px"><button class="btn" onclick="upload()">اكسب 30 نقطة</button><button class="btn o" onclick="go('market')">اصرف نقاطك</button></div></div>
<h2>سجل النقاط</h2><div class="card">${S.hist.map(h=>`<div class="hist"><span>${h.t}</span><span class="${h.v>0?'plus':'minus'}">${h.v>0?'+':''}${h.v}</span></div>`).join('')}</div>
<h2>مدفوعات التوصيل</h2><div class="card">${S.rec.length?S.rec.map(r=>`<div class="hist"><span>طلب #${r.o} - ${r.w}</span><span><b>${r.a} ج.م</b> <span class="tag e">${r.s}</span></span></div>`).join(''):'<div class="empty">مفيش مدفوعات توصيل لسه.</div>'}<p style="color:var(--mut);font-size:.85rem;margin-bottom:0">بتدفع رسوم التوصيل مع كل طلب (عند الاستلام أو دلوقتي). مفيش رصيد فلوس ولا شحن محفظة.</p></div>`},
admin(){const pend=S.books.filter(b=>b.s==='pending'),dis=S.orders.filter(o=>o.st==='disputed'),door=S.rec.length;
$('#app').innerHTML=`<h2 style="margin-top:.4em">لوحة إدارة المنصة</h2><div class="stats"><div class="stat"><b>${S.users.toLocaleString('ar-EG')}</b><small>إجمالي المستخدمين</small></div><div class="stat"><b>${(S.books.filter(b=>b.s==='ok').length+2400).toLocaleString('ar-EG')}</b><small>كتب نشطة</small></div><div class="stat"><b>${S.swaps}</b><small>تبادلات مكتملة</small></div><div class="stat"><b>${(3450+door*5).toLocaleString('ar-EG')} ج.م</b><small>إيراد التوصيل</small></div></div>
<h2>مراجعة الكتب المرفوعة</h2><div class="card tw">${pend.length?`<table><tr><th>الكتاب</th><th>المحافظة</th><th>المالك</th><th></th></tr>${pend.map(b=>`<tr><td>${b.img?`<img src="${b.img}" alt="" style="height:48px;border-radius:6px;vertical-align:middle;margin-inline-end:8px">`:''}${b.t}</td><td>${b.g}</td><td>${b.o==='me'?'أنا':b.o}</td><td class="row"><button class="btn s" onclick="mod(${b.id},1)">قبول</button><button class="btn r s" onclick="mod(${b.id},0)">رفض</button></td></tr>`).join('')}</table>`:'<div class="empty">مفيش كتب مستنية مراجعة.</div>'}</div>
<h2>حل النزاعات</h2><div class="card">${dis.length?dis.map(o=>`<div class="hist" style="flex-wrap:wrap;gap:8px"><span>طلب #${o.id} - ${bk(o.b).t}</span><span class="row"><button class="btn s" onclick="resolve(${o.id},'a')">رد النقاط للطالب</button><button class="btn o s" onclick="resolve(${o.id},'b')">إغلاق لصالح المالك</button></span></div>`).join(''):'<div class="empty">مفيش نزاعات مفتوحة. أي طلب فيه إبلاغ عن مشكلة هيظهر هنا.</div>'}</div>
<h2>الكافيهات الشريكة</h2><div class="card tw"><table><tr><th>الكافيه</th><th>المحافظة</th><th>عمليات QR</th><th></th></tr>${S.cafes.map((c,i)=>`<tr><td>${c.n}</td><td>${c.g}</td><td>${c.k}</td><td><button class="btn o s" onclick="S.cafes[${i}].k++;R.admin()">تسجيل مسح QR</button></td></tr>`).join('')}</table></div>`},
strategy(){const T={vpc:'قيمة المنتج (VPC)',icp:'العميل المثالي (ICP)',bmc:'نموذج العمل (BMC)'};
const C={vpc:`<div class="g3"><div class="card"><h3>مهام العميل</h3><ul class="l"><li>يقرا كتب كتير بميزانية قليلة</li><li>يفضّي رف الكتب المركونة</li><li>يلاقي ناس بتحب نفس الكتب</li></ul><h3>الآلام</h3><ul class="l"><li>الكتب غالية</li><li>الكتب القديمة بتاخد مكان ومحدش بيشتريها</li><li>الخوف من حالة الكتاب أو من النصب</li></ul><h3>المكاسب</h3><ul class="l"><li>كتب جديدة من غير فلوس</li><li>مجتمع قراء</li><li>استلام سهل وآمن</li></ul></div>
<div class="card"><h3>المنتج</h3><ul class="l"><li>منصة تبادل كتب بالنقاط أو كتاب بكتاب</li><li>QR وتأكيد من الطرفين</li><li>نقاط استلام في كافيهات شريكة</li></ul><h3>مسكّنات الألم</h3><ul class="l"><li>النقاط بدل الدفع</li><li>مراجعة الكتب قبل النشر</li><li>إدارة النزاعات</li></ul><h3>صانعات المكسب</h3><ul class="l"><li>30 نقطة على كل كتاب</li><li>فلتر بالمحافظة</li><li>توصيل بـ 25 ج.م</li></ul></div></div>`,
icp:`<div class="g3"><div class="card"><h3>سلمى القارئة الشغوفة</h3><p style="color:var(--mut)">26 سنة، مصممة في القاهرة. بتخلص كتابين في الشهر وبتحب الروايات والأدب المترجم. عايزة تقرا أكتر من غير ما تصرف على كل كتاب.</p><ul class="l"><li>بتستخدم إنستجرام وفودافون كاش</li><li>بتفضل الاستلام من كافيه قريب</li><li>أكبر خوف: حالة الكتاب</li></ul></div>
<div class="card"><h3>أحمد جامع الكتب</h3><p style="color:var(--mut)">34 سنة، مهندس في الإسكندرية. عنده أكتر من 300 كتاب وعايز يبدّل الطبعات القديمة والنادرة.</p><ul class="l"><li>بيحب التاريخ والعلوم</li><li>بيعرض كتب كتير وبيدوّر على النادر</li><li>أكبر خوف: التبادل مش عادل</li></ul></div></div>`,
bmc:`<div class="row noprint" style="justify-content:flex-end"><button class="btn o" onclick="print()">طباعة النموذج</button></div><div class="bmc"><div class="card"><h4>الشركاء</h4><ul class="l"><li>كافيهات شريكة</li><li>بوسطة / شركات شحن</li><li>فوري وفودافون كاش</li></ul></div><div class="card"><h4>الأنشطة</h4><ul class="l"><li>مراجعة الكتب</li><li>إدارة النزاعات</li><li>بناء المجتمع</li></ul></div><div class="card w2"><h4>القيمة المقدمة</h4><ul class="l"><li>كتب جديدة بالنقاط</li><li>تبادل آمن بـ QR</li><li>استلام من كافيه مجاناً</li></ul></div><div class="card"><h4>علاقة العملاء</h4><ul class="l"><li>مجتمع وتقييمات</li><li>دعم واتساب</li></ul></div><div class="card"><h4>الشرائح</h4><ul class="l"><li>القراء الشباب</li><li>جامعو الكتب</li></ul></div><div class="card"><h4>الموارد</h4><ul class="l"><li>الفريق والتطبيق</li><li>قاعدة الكتب</li></ul></div><div class="card"><h4>القنوات</h4><ul class="l"><li>سوشيال ميديا</li><li>الكافيهات</li></ul></div><div class="card w5"><h4>التكاليف</h4><ul class="l"><li>الاستضافة والتطوير</li><li>تسوية رسوم الشحن (20 ج.م للطلب)</li></ul></div><div class="card w5"><h4>الإيرادات</h4><ul class="l"><li>هامش التوصيل (5 إلى 15 ج.م)</li><li>رعاية الكافيهات والإعلانات</li><li>شراء نقاط إضافية لاحقاً</li></ul></div></div>`};
$('#app').innerHTML=`<h2 style="margin-top:.4em">مخططات العمل والاستراتيجية</h2><div class="tabs">${Object.keys(T).map(k=>`<button class="tab ${S.stab===k?'on':''}" onclick="S.stab='${k}';R.strategy()">${T[k]}</button>`).join('')}</div>${C[S.stab]}`}};
function fl(){const q=$('#fq').value.trim(),v=i=>$('#'+i).value;
const L=S.books.filter(b=>b.s==='ok'&&(!v('fg')||b.g===v('fg'))&&(!v('fc')||b.c===v('fc'))&&(!v('fn')||b.n===v('fn'))&&(!v('fx')||b.x===v('fx'))&&(!q||(b.t+b.a).includes(q)));
$('#gr').innerHTML=L.length?L.map(b=>bcard(b)).join(''):'<div class="empty" style="grid-column:1/-1">مفيش كتب بالفلاتر دي. جرّب تغيّر المحافظة أو النوع.</div>';stag()}
function propose(id){const b=bk(id),m=mine().filter(x=>x.s==='ok'&&x.id!==id);
modal(`<h3>طلب: ${b.t}</h3><p style="color:var(--mut);margin:0">من ${b.o} في ${b.g}</p>
<label>هتدفع إزاي؟</label><label class="opt"><input type="radio" name="m" value="pts" checked onchange="pm()">بنقاطي (${b.p} نقطة، رصيدك ${S.pts})</label>
<label class="opt"><input type="radio" name="m" value="book" onchange="pm()">بكتاب من مكتبتي</label>
<div id="bk" style="display:none"><select id="off">${m.length?m.map(x=>`<option value="${x.id}">${x.t}</option>`).join(''):'<option value="">مفيش كتب معتمدة في مكتبتك</option>'}</select></div>
<label>الاستلام</label><label class="opt"><input type="radio" name="d" value="cafe" checked onchange="pm()">كافيه شريك / نقطة استلام (مجاناً)</label>
<label class="opt"><input type="radio" name="d" value="door" onchange="pm()">شحن من الباب للباب (25 ج.م)</label>
<div id="py" style="display:none"><select id="pay"><option value="cod">الدفع عند الاستلام</option><option value="فوري">ادفع الآن - فوري</option><option value="فودافون كاش">ادفع الآن - فودافون كاش</option><option value="إنستا باي">ادفع الآن - إنستا باي</option></select></div>
<div class="row" style="margin-top:16px"><button class="btn" onclick="sendReq(${id})">ابعت الطلب</button><button class="btn o" onclick="closeM()">إلغاء</button></div>`)}
function pm(){const g=n=>document.querySelector(`input[name=${n}]:checked`).value;$('#bk').style.display=g('m')==='book'?'block':'none';$('#py').style.display=g('d')==='door'?'block':'none'}
function sendReq(id){const b=bk(id),g=n=>document.querySelector(`input[name=${n}]:checked`).value,m=g('m'),d=g('d');let off=null;
if(m==='pts'){if(S.pts<b.p)return toast('رصيدك مش كفاية. اعرض كتاب واكسب 30 نقطة.');}
else{off=+$('#off').value;if(!off)return toast('اعرض كتاب في مكتبتك الأول.')}
const o={id:S.nid++,b:id,m,off,d,st:'pending',me:false,ot:false,cafe:'كافيه ديوان - الزمالك'};
if(m==='pts'){S.pts-=b.p;S.hist.unshift({t:'طلب: '+b.t,v:-b.p})}
if(d==='door'){const p=$('#pay').value;o.pay=p==='cod'?'cod':'paid';S.rec.unshift({o:o.id,a:25,w:p==='cod'?'الدفع عند الاستلام':'ادفع الآن - '+p,s:p==='cod'?'عند الاستلام':'مدفوع'})}
S.orders.unshift(o);closeM();S.tab='pending';nav();go('orders');toast('اتبعت طلبك. مستنيين رد صاحب الكتاب.')}
function ocard(o){const b=bk(o.b),w=o.m==='pts'?b.p+' نقطة':'بكتاب: '+(bk(o.off)||{t:'-'}).t;
return `<div class="card" style="display:flex;gap:14px;margin-bottom:12px;flex-wrap:wrap"><div style="width:90px">${cover(b)}</div><div style="flex:1;min-width:200px"><div class="row"><h3>${b.t}</h3><span class="st ${o.st}">${CN[o.st]}</span></div>
<div style="color:var(--mut);font-size:.9rem">طلب #${o.id} | ${w} | ${o.d==='cafe'?'استلام من '+(o.cafe||'كافيه شريك'):'شحن الباب للباب'}</div>
${o.st==='ongoing'?`<div style="margin:6px 0;font-size:.9rem">تأكيدك: ${o.me?'تم':'لسه'} | تأكيد الطرف التاني: ${o.ot?'تم':'لسه'}</div>`:''}
<div class="row" style="margin-top:8px">${o.st==='pending'?`<button class="btn s" onclick="accept(${o.id})">محاكاة: المالك وافق</button>`:''}
${o.st==='ongoing'?`<button class="btn o s" onclick="qrm(${o.id})">عرض QR</button>${o.me?'':`<button class="btn s" onclick="conf(${o.id},'me')">استلمت الكتاب بحالة ممتازة</button>`}${o.ot?'':`<button class="btn o s" onclick="conf(${o.id},'ot')">محاكاة: الطرف التاني أكّد</button>`}<button class="btn r s" onclick="issue(${o.id})">إبلاغ عن مشكلة</button>`:''}</div></div></div>`}
const oo=id=>S.orders.find(o=>o.id===id);
function accept(id){oo(id).st='ongoing';R.orders();toast('المالك وافق. اعرض الـ QR وقت الاستلام.')}
function conf(id,w){const o=oo(id);o[w]=true;if(o.me&&o.ot){o.st='done';S.swaps++;S.hist.unshift({t:'تبادل مكتمل: '+bk(o.b).t,v:0});toast('التبادل اكتمل. مبروك على الكتاب الجديد!')}else toast('تم تأكيدك. مستنيين الطرف التاني.');R.orders()}
function issue(id){oo(id).st='disputed';R.orders();toast('اتبلغ عن المشكلة. فريق الإدارة هيراجع الطلب.')}
function resolve(id,w){const o=oo(id),b=bk(o.b);if(w==='a'&&o.m==='pts'){S.pts+=b.p;S.hist.unshift({t:'استرداد: '+b.t,v:b.p})}o.st=w==='a'?'pending':'done';nav();R.admin();toast('تم حل النزاع')}
function mod(id,ok){const b=bk(id);if(ok)b.s='ok';else S.books=S.books.filter(x=>x.id!==id);R.admin();toast(ok?'اتقبل الكتاب ونزل في المكتبة':'اترفض الكتاب')}
function qr(seed){let h=0;for(const c of seed)h=(h*31+c.charCodeAt(0))>>>0;const n=21;let r='';
for(let y=0;y<n;y++)for(let x=0;x<n;x++){let on;const f=(a,b)=>{const dx=x-a,dy=y-b;if(dx<0||dy<0||dx>6||dy>6)return null;return Math.max(Math.abs(dx-3),Math.abs(dy-3))!==2};
const q=f(0,0)??f(14,0)??f(0,14);if(q!==null)on=q;else{h=(h*1103515245+12345)>>>0;on=(h>>16)&1}
if(on)r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
return `<svg viewBox="-1 -1 23 23" width="200" height="200" style="background:#fff;border-radius:8px;padding:6px" fill="#000" shape-rendering="crispEdges">${r}</svg>`}
function qrm(id){const code='BN-'+id+'-'+Math.floor(Date.now()/60000)%10000;modal(`<h3>كود الاستلام</h3><p style="color:var(--mut)">اعرض الكود ده للكافيه الشريك أو مندوب الشحن عند التسليم.</p><div style="text-align:center">${qr(code)}<div class="cairo" style="margin:8px 0;letter-spacing:2px">${code}</div></div><button class="btn" onclick="closeM()">تمام</button>`)}
function upload(){UP=null;modal(`<h3>اعرض كتابك واكسب 30 نقطة</h3><div id="up"><label>صورة الكتاب</label><input type="file" accept="image/*" id="ph" onchange="prev(this)"><div id="pv" style="margin-top:8px"></div>
<label>عنوان الكتاب</label><input id="ut" placeholder="مثال: عزازيل"><label>المؤلف</label><input id="ua"><label>المحافظة</label><select id="ug">${GOV.map(x=>`<option>${x}</option>`).join('')}</select>
<label>النوع</label><select id="uc">${CAT.map(x=>`<option>${x}</option>`).join('')}</select><label>الحالة</label><select id="un">${CON.map(x=>`<option>${x}</option>`).join('')}</select>
<div class="row" style="margin-top:16px"><button class="btn" onclick="sub()">ارفع الكتاب</button><button class="btn o" onclick="closeM()">إلغاء</button></div></div>`)}
let UP=null;function prev(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);UP=c.toDataURL('image/jpeg',.82);$('#pv').innerHTML=`<img src="${UP}" alt="صورة الكتاب" style="max-height:140px;border-radius:8px">`};im.src=r.result};r.readAsDataURL(f)}
function sub(){const t=$('#ut').value.trim(),a=$('#ua').value.trim();if(!t||!a)return toast('اكتب عنوان الكتاب واسم المؤلف');
let h=0;for(const c of t)h=(h*7+c.charCodeAt(0))%360;const b={id:S.nid++,t,a,g:$('#ug').value,c:$('#uc').value,n:$('#un').value,x:'direct',p:50,o:'me',h,s:'pending',img:UP};
$('#up').innerHTML=`<p class="cairo">بندوّر على الغلاف الأصلي...</p><div class="scan" style="width:60%;margin:auto">${cover(b)}</div>`;
setTimeout(()=>{S.books.push(b);S.pts+=30;S.hist.unshift({t:'عرض كتاب: '+t,v:30});$('#up').innerHTML=`<div style="width:55%;margin:auto">${cover(b)}</div><p style="text-align:center"><b class="plus">+30 نقطة قراءة</b><br><span style="color:var(--mut)">لقينا الغلاف وربطناه بكتابك. الكتاب هينزل بعد مراجعة الإدارة.</span></p><button class="btn" onclick="closeM();nav();R[S.page]()">تمام</button>`;nav()},1100)}
nav();go('home');
</script></body></html>
